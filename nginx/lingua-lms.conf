# ==============================================================================
# Lingua LMS - Nginx Host VPS Configuration (Reverse Proxy & SSL)
# 
# Petunjuk Penggunaan di VPS (Ubuntu / Debian):
# 1. Salin file ini ke: /etc/nginx/sites-available/lingua-lms.conf
# 2. Ganti YOUR_DOMAIN.com dengan nama domain Anda
# 3. Aktifkan: sudo ln -s /etc/nginx/sites-available/lingua-lms.conf /etc/nginx/sites-enabled/
# 4. Tes konfigurasi: sudo nginx -t && sudo systemctl reload nginx
# 5. Pasang SSL otomatis: sudo certbot --nginx -d YOUR_DOMAIN.com
# ==============================================================================

# 1. Definisi Upstream ke Docker Containers
upstream lingua_frontend_backend_proxy {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream lingua_backend_api_proxy {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 2. Server Block (HTTP Port 80)
# (Certbot otomatis menambahkan konfigurasi HTTPS 443 saat certbot --nginx dijalankan)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    # Batas ukuran upload (audio rekaman, gambar profil, CSV)
    client_max_body_size 30M;

    # Gzip Compression untuk performa cepat
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Route /api/ ke Backend Container (Port 3000)
    location /api/ {
        proxy_pass http://lingua_backend_api_proxy/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Route rute utama / ke Frontend Container (Port 3001)
    location / {
        proxy_pass http://lingua_frontend_backend_proxy/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }
}
