# ==============================================================================
# Template Konfigurasi Nginx untuk Service Lain (Domain / Subdomain Berbeda)
#
# Contoh Kasus:
# Anda punya aplikasi lain (Node.js / Python / Docker / Go) di port 8080
# dan ingin diakses lewat domain: app2.domainanda.com
#
# Langkah Penggunaan di VPS:
# 1. Salin ke sites-available:
#    sudo cp example-other-service.conf /etc/nginx/sites-available/app2.conf
#
# 2. Ganti nama domain dan port sesuai service Anda:
#    - Ganti "app2.domainanda.com" dengan domain Anda
#    - Ganti "127.0.0.1:8080" dengan port service Anda
#
# 3. Aktifkan:
#    sudo ln -s /etc/nginx/sites-available/app2.conf /etc/nginx/sites-enabled/
#
# 4. Tes & reload Nginx:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 5. Pasang SSL Let's Encrypt:
#    sudo certbot --nginx -d app2.domainanda.com
# ==============================================================================

upstream other_service_backend {
    # Port tempat service lain Anda berjalan di host/Docker
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app2.domainanda.com;

    # Batas ukuran upload
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Forward seluruh request ke port service lain
    location / {
        proxy_pass http://other_service_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }
}
