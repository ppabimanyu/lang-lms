# ==========================================
# Lingua LMS - Frontend Container Nginx Configuration
# Serves compiled Vue 3 SPA & Proxies /api/ to backend
# ==========================================

upstream backend_api {
    server backend:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        image/svg+xml;

    # Proxy /api/ requests to Backend Container
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets with Cache (1 Year)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|svg|webp|ico|mp3|wav|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML files (Never cache index.html so updates are instantaneous)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Vue SPA HTML5 History Mode Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
